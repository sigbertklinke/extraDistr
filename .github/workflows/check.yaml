name: R-CMD-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r: devel
          - os: macos-13
            r: release
          - os: windows-latest
            r: release

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}

      - uses: r-lib/actions/setup-r-dependencies@v2

      - uses: r-lib/actions/check-r-package@v2